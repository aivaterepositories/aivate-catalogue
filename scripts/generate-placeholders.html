<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Screenshot Generator</title>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, sans-serif;
    }
    .screenshot {
      width: 1600px;
      height: 1000px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .gradient-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      color: white;
      padding: 60px;
    }
    .logo {
      font-size: 72px;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: -2px;
    }
    .tagline {
      font-size: 32px;
      font-weight: 400;
      margin-bottom: 48px;
      opacity: 0.9;
    }
    .tech-stack {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .tech-badge {
      padding: 12px 24px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      border-radius: 8px;
      font-size: 18px;
      font-weight: 500;
    }
    .overlay-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }
  </style>
</head>
<body>
  <div class="screenshot">
    <div class="gradient-bg"></div>
    <div class="overlay-grid"></div>
    <div class="content">
      <div class="logo">Gordon AI Studio</div>
      <div class="tagline">AI-Powered Medical Practice Platform</div>
      <div class="tech-stack">
        <div class="tech-badge">Next.js 16</div>
        <div class="tech-badge">TypeScript</div>
        <div class="tech-badge">Supabase</div>
        <div class="tech-badge">OpenAI</div>
      </div>
    </div>
  </div>
</body>
</html>
