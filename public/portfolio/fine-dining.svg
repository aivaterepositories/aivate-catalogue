<svg width="1600" height="1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#grad)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <text x="800" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="white" text-anchor="middle">Fine Dining Landing</text>
  <text x="800" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="400" fill="rgba(255,255,255,0.9)" text-anchor="middle">Luxury Restaurant Experience</text>

  <g transform="translate(800, 540)">
    <rect x="-220" y="0" width="120" height="44" rx="8" fill="rgba(255,255,255,0.2)"/>
              <text x="-160" y="28" font-family="system-ui" font-size="18" font-weight="500" fill="white" text-anchor="middle">Next.js</text>
    <rect x="-60" y="0" width="120" height="44" rx="8" fill="rgba(255,255,255,0.2)"/>
              <text x="0" y="28" font-family="system-ui" font-size="18" font-weight="500" fill="white" text-anchor="middle">Tailwind CSS</text>
    <rect x="100" y="0" width="120" height="44" rx="8" fill="rgba(255,255,255,0.2)"/>
              <text x="160" y="28" font-family="system-ui" font-size="18" font-weight="500" fill="white" text-anchor="middle">Custom Animations</text>
  </g>

  <text x="1560" y="970" font-family="system-ui" font-size="14" font-weight="500" fill="rgba(255,255,255,0.6)" text-anchor="end">Agency-OS Portfolio</text>
</svg>