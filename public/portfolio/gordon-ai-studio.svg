<svg width="1600" height="1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#grad)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <text x="800" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="white" text-anchor="middle">Gordon AI Studio</text>
  <text x="800" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="400" fill="rgba(255,255,255,0.9)" text-anchor="middle">AI-Powered Medical Practice Platform</text>

  <g transform="translate(800, 540)">
    <rect x="-300" y="0" width="120" height="44" rx="8" fill="rgba(255,255,255,0.2)"/>
              <text x="-240" y="28" font-family="system-ui" font-size="18" font-weight="500" fill="white" text-anchor="middle">Next.js 16</text>
    <rect x="-140" y="0" width="120" height="44" rx="8" fill="rgba(255,255,255,0.2)"/>
              <text x="-80" y="28" font-family="system-ui" font-size="18" font-weight="500" fill="white" text-anchor="middle">TypeScript</text>
    <rect x="20" y="0" width="120" height="44" rx="8" fill="rgba(255,255,255,0.2)"/>
              <text x="80" y="28" font-family="system-ui" font-size="18" font-weight="500" fill="white" text-anchor="middle">Supabase</text>
    <rect x="180" y="0" width="120" height="44" rx="8" fill="rgba(255,255,255,0.2)"/>
              <text x="240" y="28" font-family="system-ui" font-size="18" font-weight="500" fill="white" text-anchor="middle">OpenAI</text>
  </g>

  <text x="1560" y="970" font-family="system-ui" font-size="14" font-weight="500" fill="rgba(255,255,255,0.6)" text-anchor="end">Agency-OS Portfolio</text>
</svg>